name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Rust core and bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            ffi
      - name: cargo test (core)
        working-directory: core
        run: cargo test --all-features
      - name: cargo test (ffi bridge)
        working-directory: ffi
        run: cargo test --all-features

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: app
        run: flutter create --platforms=android,windows --project-name hydra_music --org dev.hydra .
      - name: Patch Android manifest
        working-directory: app
        run: python3 ../tools/patch_android_manifest.py
      - name: Build Rust library for Android (arm64)
        working-directory: ffi
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 24 -o ../app/android/app/src/main/jniLibs build --release
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: app
        run: flutter test
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-music-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
