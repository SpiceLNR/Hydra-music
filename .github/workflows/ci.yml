name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# нужно, чтобы выкладывать сборки в Releases (они не расходуют квоту артефактов)
permissions:
  contents: write

jobs:
  core-tests:
    name: Rust core and bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            ffi
      - name: cargo test (core)
        working-directory: core
        run: cargo test --all-features
      - name: cargo test (ffi bridge)
        working-directory: ffi
        run: cargo test --all-features

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      # Раннер GitHub небольшой, а debug+release сборки Android с Rust занимают много места.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: app
        run: flutter create --platforms=android,windows --project-name hydra_music --org dev.hydra .
      - name: Patch Android manifest
        working-directory: app
        run: python3 ../tools/patch_android_manifest.py
      - name: Build Rust library for Android (arm64)
        working-directory: ffi
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 24 -o ../app/android/app/src/main/jniLibs build --release
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: app
        run: flutter test
      # Постоянный ключ подписи: без него каждый запуск CI создаёт новый ключ,
      # и Android не даёт обновить приложение поверх прежней сборки.
      - name: Use a fixed signing key
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Free space before release build
        working-directory: app
        run: |
          rm -rf build/app/intermediates build/app/tmp build/app/generated
          rm -rf android/.gradle/*/executionHistory || true
          df -h /
      # Для повседневного использования: быстрее и экономнее к батарее, чем debug.
      # Подписывается отладочным ключом Flutter: подходит для личной установки.
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --dart-define=HYDRA_BUILD=${{ github.sha }}
      # Основной способ получить APK: страница Releases -> «Latest build».
      # Файлы релиза не входят в квоту хранилища артефактов.
      - name: Publish APK to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Latest build" --notes "Автоматическая сборка из ветки main" \
              --target "$GITHUB_SHA" || true
          gh release upload latest app/build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        # квота артефактов может быть исчерпана: это не должно ронять сборку
        continue-on-error: true
        with:
          name: hydra-music-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust bridge (hydra_ffi.dll)
        working-directory: ffi
        run: cargo build --release
      - name: Generate Windows folder
        working-directory: app
        run: flutter create --platforms=windows --project-name hydra_music --org dev.hydra .
      - name: Patch Windows project
        working-directory: app
        shell: bash
        run: python ../tools/patch_android_manifest.py windows
      - name: Build Windows app
        working-directory: app
        env:
          # Новый Visual Studio отказывается собирать старый плагин permission_handler_windows
          # (<experimental/coroutine>); этот флаг возвращает прежнее поведение.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter pub get
          flutter build windows --release --dart-define=HYDRA_BUILD=${{ github.sha }}
      - name: Put the Rust bridge next to the exe
        shell: bash
        run: cp ffi/target/release/hydra_ffi.dll app/build/windows/x64/runner/Release/
      - name: Publish Windows build to the latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell -Command "Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath hydra-music-windows.zip -Force"
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Latest build" --notes "Автоматическая сборка из ветки main" \
              --target "$GITHUB_SHA" || true
          gh release upload latest hydra-music-windows.zip --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hydra-music-windows
          path: app/build/windows/x64/runner/Release
          retention-days: 3
