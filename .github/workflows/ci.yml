name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Два запуска подряд не должны одновременно перезаписывать файл в Releases
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# нужно, чтобы выкладывать сборки в Releases (они не расходуют квоту артефактов)
permissions:
  contents: write

jobs:
  core-tests:
    name: Rust core and bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            ffi
      - name: cargo test (core)
        working-directory: core
        run: cargo test --all-features
      - name: cargo test (ffi bridge)
        working-directory: ffi
        run: cargo test --all-features

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      # Раннер GitHub небольшой, а debug+release сборки Android с Rust занимают много места.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: app
        run: flutter create --platforms=android,windows --project-name hydra_music --org com.spicelnr .
      - name: Patch Android manifest
        working-directory: app
        run: python3 ../tools/patch_android_manifest.py
      - name: Build Rust library for Android (arm64)
        working-directory: ffi
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 24 -o ../app/android/app/src/main/jniLibs build --release
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: app
        run: flutter test
      # Постоянный ключ подписи: без него каждый запуск CI создаёт новый ключ,
      # и Android не даёт обновить приложение поверх прежней сборки.
      # Ключ хранится в секрете репозитория HYDRA_KEYSTORE_B64 (base64 файла keystore),
      # в самом репозитории его нет. Путь к ключу передаётся Gradle явно (HYDRA_KEYSTORE,
      # см. patch_android_manifest.py): от того, где раннер ищет debug.keystore, подпись
      # больше не зависит. В основном репозитории без секрета сборка падает;
      # в чужом форке Flutter создаст временный ключ сам.
      - name: Use a fixed signing key
        env:
          HYDRA_KEYSTORE_B64: ${{ secrets.HYDRA_KEYSTORE_B64 }}
        run: |
          if [ -n "$HYDRA_KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/hydra.keystore"
            echo "$HYDRA_KEYSTORE_B64" | base64 -d > "$KS"
            mkdir -p ~/.android
            cp "$KS" ~/.android/debug.keystore
            echo "HYDRA_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<не задан>}"
            fp=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey \
              | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
            [ -n "$fp" ] || { echo "Ключ из секрета не открылся (пароль android, псевдоним androiddebugkey)"; exit 1; }
            echo "Отпечаток ключа из секрета (SHA-256): $fp"
            echo "HYDRA_KEY_SHA256=$fp" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REPOSITORY" = "SpiceLNR/Hydra-music" ]; then
            echo "Секрета HYDRA_KEYSTORE_B64 нет: APK со временным ключом не встанет поверх прежнего"
            exit 1
          else
            echo "Секрета HYDRA_KEYSTORE_B64 нет: ключ подписи будет временным"
          fi
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Free space before release build
        working-directory: app
        run: |
          rm -rf build/app/intermediates build/app/tmp build/app/generated
          rm -rf android/.gradle/*/executionHistory || true
          df -h /
      # Для повседневного использования: быстрее и экономнее к батарее, чем debug.
      # Подписывается отладочным ключом Flutter: подходит для личной установки.
      # --no-shrink: R8 вырезает из релиза классы распознавания QR (ML Kit), камера не открывается
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --no-shrink --dart-define=HYDRA_BUILD=${{ github.sha }}
      # Подпись APK проверяется до публикации: битый файл и файл, подписанный
      # не ключом из секрета, в релиз не попадают.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose "$APK"
          apk_fp=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: *//')
          echo "Отпечаток подписи APK (SHA-256): $apk_fp"
          if [ -n "$HYDRA_KEY_SHA256" ] && [ "$apk_fp" != "$HYDRA_KEY_SHA256" ]; then
            echo "APK подписан не ключом из секрета ($HYDRA_KEY_SHA256): на телефон поверх прежней версии он не встанет"
            exit 1
          fi
      # Основной способ получить APK: страница Releases -> «Latest build».
      # Файлы релиза не входят в квоту хранилища артефактов.
      - name: Publish APK to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Latest build" --notes "Автоматическая сборка из ветки main" \
              --target "$GITHUB_SHA" || true
          gh release upload latest app/build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
      # Скачиваем опубликованный файл и сверяем с собранным: сборка падает при расхождении.
      - name: Check the published APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download latest --repo "$GITHUB_REPOSITORY" \
            --pattern app-release.apk --dir "$RUNNER_TEMP/published" --clobber
          built=$(sha256sum app/build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)
          pub=$(sha256sum "$RUNNER_TEMP/published/app-release.apk" | cut -d' ' -f1)
          echo "собрано:      $built"
          echo "опубликовано: $pub"
          [ "$built" = "$pub" ]
      - uses: actions/upload-artifact@v4
        # квота артефактов может быть исчерпана: это не должно ронять сборку
        continue-on-error: true
        with:
          name: hydra-music-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust bridge (hydra_ffi.dll)
        working-directory: ffi
        run: cargo build --release
      - name: Generate Windows folder
        working-directory: app
        run: flutter create --platforms=windows --project-name hydra_music --org com.spicelnr .
      - name: Patch Windows project
        working-directory: app
        shell: bash
        run: python ../tools/patch_android_manifest.py windows
      - name: Build Windows app
        working-directory: app
        env:
          # Новый Visual Studio отказывается собирать старый плагин permission_handler_windows
          # (<experimental/coroutine>); этот флаг возвращает прежнее поведение.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter pub get
          flutter build windows --release --dart-define=HYDRA_BUILD=${{ github.sha }}
      - name: Put the Rust bridge next to the exe
        shell: bash
        run: cp ffi/target/release/hydra_ffi.dll app/build/windows/x64/runner/Release/
      - name: Publish Windows build to the latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # zip собирается 7-Zip: у Compress-Archive (PowerShell 5) внутри обратные слэши,
        # и часть распаковщиков разбирает такой архив неправильно.
        # version-windows.json читает автообновление: версия, размер и SHA-256 архива.
        # Архив выкладывается раньше описания, чтобы описание не указывало на старый файл.
        run: |
          Z="$GITHUB_WORKSPACE/hydra-music-windows.zip"
          rm -f "$Z"
          (cd app/build/windows/x64/runner/Release && 7z a -tzip "$Z" * >/dev/null)
          7z l "$Z" | grep -q ' hydra_music\.exe$' || { echo "В архиве нет hydra_music.exe в корне"; exit 1; }
          VER=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/^version: *//; s/+.*//' | tr -d '\r')
          SIZE=$(stat -c %s "$Z")
          SHA=$(sha256sum "$Z" | cut -d' ' -f1)
          printf '{"version":"%s","build":"%s","file":"hydra-music-windows.zip","size":%s,"sha256":"%s"}\n' \
            "$VER" "$GITHUB_SHA" "$SIZE" "$SHA" > version-windows.json
          cat version-windows.json
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Latest build" --notes "Автоматическая сборка из ветки main" \
              --target "$GITHUB_SHA" || true
          gh release upload latest "$Z" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload latest version-windows.json --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hydra-music-windows
          path: app/build/windows/x64/runner/Release
          retention-days: 3
