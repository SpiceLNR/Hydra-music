[package]
name = "hydra_ffi"
version = "0.22.0"
edition = "2021"
description = "C ABI over hydra_core: one JSON in, one JSON out"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "hydra_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
# связь через интернет (iroh) включена: без неё устройства видят друг друга только в одной сети
hydra_core = { path = "../core", features = ["internet"] }
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
