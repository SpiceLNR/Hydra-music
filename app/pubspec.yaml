name: hydra_music
description: Hydra Music - private audio player with P2P folder sync.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  # Android: системный ExoPlayer (без заиканий, хорошо работает с Bluetooth)
  just_audio: ">=0.9.40 <0.11.0"
  ffi: ^2.1.3
  path_provider: ^2.1.4
  permission_handler: ^13.0.0
  # Фоновое воспроизведение: служба переднего плана, уведомление, экран блокировки
  audio_service: ^0.18.15
  audio_session: any
  # выбор картинки для обложки (системная галерея, разрешений не требует)
  image_picker: ^1.1.2
  # Windows: окно-шторка у края экрана и настройки
  window_manager: ^0.5.0
  screen_retriever: ^0.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Шрифт Selawik (MIT). Лежит только обычное начертание; жирное и светлое Flutter
  # подставит из него. Добавите selawkb.ttf / selawkl.ttf - раскомментируйте строки ниже.
  fonts:
    - family: Selawik
      fonts:
        - asset: assets/fonts/selawk.ttf
        # - asset: assets/fonts/selawkb.ttf
        #   weight: 700
        # - asset: assets/fonts/selawkl.ttf
        #   weight: 300
